<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      background-color: #1c1c1d;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      background-color: #3390ec;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #log {
      margin-top: 20px;
      font-size: 14px;
      color: #aaaaaa;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <button id="btn">Выдать доступ к статусу</button>
  <div id="log">Ожидание нажатия...</div>

  <script>
    const tg = window.Telegram.WebApp;
    const log = document.getElementById('log');
    tg.ready();

    // Выводим диагностику сразу при открытии
    const user = tg.initDataUnsafe?.user;
    log.innerHTML = 
      `Версия API: ${tg.version}<br>` +
      `Платформа: ${tg.platform}<br>` +
      `Premium: ${user?.is_premium ? "Да ✅" : "Нет ❌ (без него не сработает)"}`;

    // Слушаем системное событие ответа от Telegram
    tg.onEvent('emojiStatusAccessRequested', (event) => {
      log.innerHTML += `<br>Событие от Telegram: <b>${event.status}</b>`;
    });

    document.getElementById('btn').onclick = function() {
      log.innerHTML += "<br>Нажата кнопка, отправляю запрос...";
      try {
        tg.requestEmojiStatusAccess((allowed) => {
          log.innerHTML += `<br>Ответ callback: <b>${allowed ? "Разрешено ✅" : "Отклонено ❌"}</b>`;
        });
      } catch (e) {
        log.innerHTML += `<br>Ошибка JS: ${e.message}`;
      }
    };
  </script>
</body>
</html>
