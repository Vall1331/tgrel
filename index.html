<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #1c1c1d;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      background-color: #3390ec;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="btn">Выдать доступ к статусу</button>
  <p id="info"></p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    document.getElementById('btn').onclick = function() {
      if (!tg.requestEmojiStatusAccess) {
        document.getElementById('info').innerText = "Ошибка: обновите Telegram";
        return;
      }
      tg.requestEmojiStatusAccess((allowed) => {
        document.getElementById('info').innerText = allowed 
          ? "✅ Готово! Доступ разрешен." 
          : "❌ Доступ отклонен.";
      });
    };
  </script>
</body>
</html>
